duel:
  rounds_to_win: 3
  spawn_delay_ticks: 10
  max_mobs_per_player: 99

arena:
  world: world
  x: 6767.0
  z: 1410.0
  player_y: 228.0
  mob_y: 220.0
  player_offset_x: 20.0
  mob_offset_x: 8.0
  spawn_spacing: 1.5
  spawn_per_row: 6

hit_and_run:
  backoff_power: 0.6

mobs:
  zombie_netherite:
    name: "&cЗомби-Рыцарь"
    summon_command: 'summon zombie {equipment:{mainhand:{id:"minecraft:netherite_sword"},offhand:{id:"minecraft:totem_of_undying"},head:{id:"minecraft:netherite_helmet"},chest:{id:"minecraft:netherite_chestplate"},legs:{id:"minecraft:netherite_leggings"},feet:{id:"minecraft:netherite_boots"}}}'
    lore:
      - "&7Тяжёлый рыцарь в незеритке"
      - "&7Контрит скелета — догоняет и рубит"
      - "&7Боится голема — тот крепче"
    effects:
      - "SPEED:0"
    on_hit_effects: []
    hit_and_run: false

  spider:
    name: "&aЯдовитый Паук"
    summon_command: 'summon spider'
    lore:
      - "&7Быстрый и ядовитый"
      - "&7Отравляет укусом"
    effects:
      - "SPEED:1"
    on_hit_effects:
      - "POISON:0:5"
    hit_and_run: false

  iron_golem:
    name: "&eЖелезный Голем"
    summon_command: 'summon iron_golem'
    lore:
      - "&7Огромный запас здоровья (100 HP)"
      - "&7Мощный урон в ближнем бою"
      - "&7Медленный — боится скелета"
    effects: []
    on_hit_effects:
      - "SLOWNESS:1:3"
    hit_and_run: false

  skeleton:
    name: "&fСкелет-Лучник"
    summon_command: 'summon skeleton'
    lore:
      - "&7Стреляет с дистанции"
      - "&7Контрит голема — тот не догонит"
      - "&7Слаб в ближнем бою"
    effects:
      - "SPEED:1"
    on_hit_effects:
      - "WEAKNESS:0:3"
    hit_and_run: false

  creeper:
    name: "&2Крипер"
    summon_command: 'summon creeper'
    lore:
      - "&7Взрывается при сближении"
      - "&7Убивает почти любого вблизи"
      - "&7Лёгкая цель для лучника"
    effects:
      - "SPEED:1"
    on_hit_effects: []
    hit_and_run: false

  enderman:
    name: "&5Эндермен"
    summon_command: 'summon enderman'
    lore:
      - "&7Телепортируется к цели"
      - "&7Высокий урон"
    effects:
      - "SPEED:1"
    on_hit_effects: []
    hit_and_run: false
