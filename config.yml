duel:
  rounds_to_win: 3
  spawn_delay_ticks: 10
  max_mobs_per_player: 99
  timer_seconds: 300
  timer_warn_at: 60
  spectator_bounds: 40.0

arena_settings:
  player_offset_x: 20.0
  player_height_offset: 15.0
  mob_offset_x: 8.0
  spawn_spacing: 1.5
  spawn_per_row: 6

arenas:
  arena1:
    world: world
    x: 2000.0
    y: 100.0
    z: 2000.0
  arena2:
    world: world
    x: 2000.0
    y: 100.0
    z: -2000.0
  arena3:
    world: world
    x: -2000.0
    y: 100.0
    z: 2000.0

