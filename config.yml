duel:
  rounds_to_win: 3
  spawn_delay_ticks: 10
  max_mobs_per_player: 99
  timer_seconds: 300
  timer_warn_at: 60

arena_settings:
  player_offset_x: 20.0
  player_height_offset: 15.0
  mob_offset_x: 8.0
  spawn_spacing: 1.5
  spawn_per_row: 6

arenas:
  arena1:
    world: world
    x: 2000.0
    y: 100.0
    z: 2000.0
  arena2:
    world: world
    x: 2000.0
    y: 100.0
    z: -2000.0
  arena3:
    world: world
    x: -2000.0
    y: 100.0
    z: 2000.0

hit_and_run:
  backoff_power: 0.6

mobs:
  zombie_netherite:
    name: "&cЗомби-Рыцарь"
    summon_command: 'summon zombie {equipment:{mainhand:{id:"minecraft:netherite_sword"},offhand:{id:"minecraft:totem_of_undying"},head:{id:"minecraft:netherite_helmet"},chest:{id:"minecraft:netherite_chestplate"},legs:{id:"minecraft:netherite_leggings"},feet:{id:"minecraft:netherite_boots"}}}'
    lore:
      - "&7Тяжёлый рыцарь"
      - "&7Контрит скелета"
    effects:
      - "SPEED:0"
    on_hit_effects: []
    hit_and_run: false

  spider:
    name: "&aЯдовитый Паук"
    summon_command: 'summon spider'
    lore:
      - "&7Быстрый и ядовитый"
    effects:
      - "SPEED:1"
    on_hit_effects:
      - "POISON:0:5"
    hit_and_run: false

  iron_golem:
    name: "&eЖелезный Голем"
    summon_command: 'summon iron_golem'
    lore:
      - "&7Огромный HP"
      - "&7Контрится скелетом"
    effects: []
    on_hit_effects:
      - "SLOWNESS:1:3"
    hit_and_run: false

  skeleton:
    name: "&fСкелет-Лучник"
    summon_command: 'summon skeleton'
    lore:
      - "&7Контрит голема"
      - "&7Слаб против зомби"
    effects:
      - "SPEED:1"
    on_hit_effects:
      - "WEAKNESS:0:3"
    hit_and_run: false

  creeper:
    name: "&2Крипер"
    summon_command: 'summon creeper'
    lore:
      - "&7Взрывается вблизи"
    effects:
      - "SPEED:1"
    on_hit_effects: []
    hit_and_run: false

  enderman:
    name: "&5Эндермен"
    summon_command: 'summon enderman'
    lore:
      - "&7Телепортируется"
    effects:
      - "SPEED:1"
    on_hit_effects: []
    hit_and_run: false
