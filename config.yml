# =========================================================
#  DUEL ARENA CONFIG  v2.0  (optimized & balanced)
#  Автор ребаланса: AI
#  Изменения: удалён rabbit_killer, добавлены creeper-юниты,
#             выровнены статы, добавлены роли и контр-пики.
# =========================================================

duel:
  rounds_to_win: 3
  spawn_delay_ticks: 10
  max_mobs_per_player: 99
  timer_seconds: 300
  timer_warn_at: 60
  spectator_bounds: 40.0
  spectator_center_y_offset: 5.0

  child_track_radius_x: 60.0
  child_track_radius_y: 30.0
  child_track_radius_z: 60.0

  track_children_types:
    - VEX
    - SLIME
    - MAGMA_CUBE
    - GHAST
    - PHANTOM
    - SILVERFISH
    - ENDERMITE
    - CREEPER            # чтобы заряженные криперы не терялись

# ---------------------------------------------------------
#  Веса редкостей (сумма = 100)
# ---------------------------------------------------------
rarity_weights:
  COMMON: 40
  RARE: 26
  SUPER_RARE: 16
  EPIC: 10
  MYTHIC: 5
  LEGENDARY: 3

# ---------------------------------------------------------
#  Ставки (bet values)
# ---------------------------------------------------------
bet_values:
  default: 50
  DIAMOND: 500
  NETHERITE_INGOT: 1000
  EMERALD: 300
  GOLD_INGOT: 200
  IRON_INGOT: 100
  GOLDEN_APPLE: 400
  ENCHANTED_GOLDEN_APPLE: 2000
  NETHERITE_SCRAP: 800
  ELYTRA: 3000
  NETHER_STAR: 5000
  TOTEM_OF_UNDYING: 1500
  ANCIENT_DEBRIS: 700
  DIAMOND_BLOCK: 4500
  NETHERITE_BLOCK: 9000
  EMERALD_BLOCK: 2700
  GOLD_BLOCK: 1800
  IRON_BLOCK: 900

# ---------------------------------------------------------
#  Настройки арены
# ---------------------------------------------------------
arena_settings:
  player_offset_x: 20.0
  player_height_offset: 15.0
  mob_offset_x: 8.0
  spawn_spacing: 1.5
  spawn_per_row: 6

default_world: world

arenas:
  arena1: "2000 100 2000"
  arena2: "2000 100 -2000"
  arena3: "-2000 100 -2000"

# ---------------------------------------------------------
#  Веса количества мобов
# ---------------------------------------------------------
spawn_count_weights:
  1-3: 40
  4-7: 30
  8-12: 20
  13-17: 8
  18-20: 2

hit_and_run:
  backoff_power: 0.6

