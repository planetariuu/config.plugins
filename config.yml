    - potion{type=SLOW;duration=40;level=1} @target

PowerStrike:
  Skills:
    - damage{amount=3} @target

FrostShot:
  Skills:
    - shoot{type=ARROW;velocity=3;damage=4} @target
    - potion{type=SLOW;duration=60;level=1} @target

SlimeLeap:
  Skills:
    - leap{velocity=1.2} @self
    - damage{amount=3} @EntitiesInRadius{r=3}

BruteRage:
  Skills:
    - damage{amount=4} @target

WitherStrike:
  Skills:
    - potion{type=WITHER;duration=60;level=1} @target

TeleportStrike:
  Skills:
    - teleport{target=@target} @self
    - damage{amount=4} @target

ExecuteStrike:
  Skills:
    - damage{amount=5} @target

GroundSmash:
  Skills:
    - damage{amount=6} @EntitiesInRadius{r=5}

